# Nagisa netdisk + SeaweedFS — a complete, self-hosted deployment in one file.
#
#   cp .env.example .env     # edit the two REQUIRED secrets first
#   docker compose up -d --build
#   open http://127.0.0.1:8000/v1/system/health   # expect {"status":"ok",...}
#
# Read deploy/compose/README.md for the object-storage modes, backups and the
# host-bind-mount variant. Every value below can be overridden from .env.

name: nagisa

services:
  # -------------------------------------------------------------------------
  # Object storage. Nagisa only speaks the standard S3 API, so this service is
  # swappable for any other S3-compatible backend: point S3_ENDPOINT at it and
  # delete this block.
  # -------------------------------------------------------------------------
  seaweedfs:
    # Fully qualified so the REGISTRY_MIRROR below applies to this image too;
    # `docker.io/` is a no-op for a normal network and the mirror host for a
    # network that cannot reach Docker Hub.
    image: ${REGISTRY_MIRROR:-docker.io/}chrislusf/seaweedfs:4.05
    restart: unless-stopped
    command:
      - server
      - -s3
      - -dir=/data
      - -s3.config=/etc/seaweedfs/s3.json
      # Bind the advertised address explicitly. Left alone, SeaweedFS picks a
      # non-loopback interface and writes it into the cluster topology; when that
      # interface is a VPN or a virtual adapter the process starts failing
      # heartbeats and exits. The service name is resolved on the Compose
      # network, and it is also how nagisa reaches this container.
      - -ip=seaweedfs
      # Neither -master.dir nor -master.volumeSizeLimitMB belongs here.
      #
      # -master.dir: `weed server` already defaults it to the first -dir entry
      # (`if *masterOptions.metaFolder == "" { *masterOptions.metaFolder =
      # folders[0] }` in weed/command/server.go), so the master meta lands in
      # /data. Spelling it out as /data/meta is what killed the first start: the
      # check is `util.TestFolderWritable`, which only stats the folder, and
      # nothing ever creates /data/meta on a fresh volume —
      #   F server.go:325 Check Meta Folder (-mdir="/data/meta") Writable:
      #     stat /data/meta: no such file or directory
      # exits 255 and Compose reports `container ... is unhealthy`.
      #
      # -master.volumeSizeLimitMB: the 30720 that used to be here (30 GiB, read
      # as the 30 GB SeaweedFS means) is above the hard ceiling
      # (`if *masterOptions.volumeSizeLimitMB > util.VolumeSizeLimitGB*1000`), so
      # startup died with
      #   F server.go:318 masterVolumeSizeLimitMB should be less than 30000
      # despite what that message says, 30000 itself is accepted; only 30001+ is
      # refused. Left unset, this image's own entrypoint injects
      # `-master.volumeSizeLimitMB=1024`, i.e. a volume seals at 1 GiB — on
      # purpose, because that same entrypoint passes -master.volumePreallocate,
      # which reserves the space up front. For bigger volumes, add
      #   - -master.volumeSizeLimitMB=30000
      #   - -master.volumePreallocate=false
      # (Compose args come last, so they win over the entrypoint's).
    environment:
      # SeaweedFS is Go and has no cgroup-aware default, so it would otherwise
      # size its caches from the *host* CPU count.
      GOMAXPROCS: ${SEAWEED_GOMAXPROCS:-2}
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      # Only needed so a browser can talk to S3 directly in presigned mode.
      - "${SEAWEED_S3_PORT:-8333}:8333"
    healthcheck:
      # The image is Alpine-based, so wget is available. This checks that the S3
      # listener answers at all; the bucket itself is created by Nagisa.
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # -------------------------------------------------------------------------
  # The netdisk service: REST + gRPC + the built web front end + /docs/.
  # -------------------------------------------------------------------------
  nagisa:
    build:
      # Repository root, because the image compiles both the Go service and the
      # front end out of this context.
      context: ../..
      dockerfile: Dockerfile
      args:
        # Baked into the binary as main.Version and shown by
        # GET /v1/system/info. Docker cannot see .git, so it has to be passed.
        VERSION: ${NAGISA_VERSION:-dev}
        # Registry prefix for node/golang/alpine (all Docker Hub images).
        # Empty means docker.io; a mirror host makes the build work where
        # Docker Hub is unreachable. See .env.example.
        REGISTRY_MIRROR: ${REGISTRY_MIRROR:-}
        # Go module proxy for the `go mod download` layer. The upstream default
        # is proxy.golang.org, which is unreachable on the same networks that
        # need REGISTRY_MIRROR; point it at a mirror. See .env.example.
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: nagisa:${NAGISA_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      seaweedfs:
        # Nagisa probes its bucket at startup and fails hard when the endpoint
        # is unreachable, so wait for the listener rather than for the process.
        condition: service_healthy
    environment:
      # Every key below carries the KRATOS_ prefix on purpose — do not "clean it
      # up". configs/config.yaml writes these as ${KEY:default}, and Kratos fills
      # such a placeholder from the *config key* KEY, which its environment
      # source only produces from the variable KRATOS_KEY. A bare `S3_ENDPOINT`
      # is a plain OS variable that nothing reads: the placeholder silently takes
      # its default instead. That is exactly how this stack first failed — with
      # S3_ENDPOINT=seaweedfs:8333 in the environment, the service still probed
      # http://127.0.0.1:8333 (itself) and died with `probe bucket ... connection
      # refused`. Values stay interpolated from .env, so the names users edit
      # there are still the unprefixed ones.
      #
      # --- paths inside the image (already absolute in the Dockerfile) -------
      KRATOS_DATABASE_SOURCE: /app/data/nagisa.db
      KRATOS_PASSWORD_KEY_FILE: /app/data/password_key.pem
      KRATOS_WEB_ROOT: /app/web/dist

      # --- secrets ----------------------------------------------------------
      KRATOS_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — openssl rand -base64 48}
      KRATOS_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # --- object storage ---------------------------------------------------
      KRATOS_S3_ENDPOINT: seaweedfs:8333
      KRATOS_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-nagisa}
      KRATOS_S3_SECRET_KEY: ${S3_SECRET_KEY:-nagisa-secret}
      KRATOS_S3_BUCKET: ${S3_BUCKET:-nagisa}
      # Address presigned URLs are signed for. Must be reachable by the browser;
      # empty keeps downloads on the server-side streaming endpoint. See .env.
      KRATOS_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      # proxy relays every chunk through this service (works everywhere);
      # presigned hands the browser a direct-to-S3 URL (needs CORS + a public
      # S3 address). The dotted form is the Kratos override for
      # upload.default_mode in configs/config.yaml.
      KRATOS_upload.default_mode: ${UPLOAD_MODE:-proxy}

      # --- web --------------------------------------------------------------
      # Same-origin deployment: leave empty and no CORS filter is needed at all.
      KRATOS_CORS_ORIGIN: ${CORS_ORIGIN:-}
      KRATOS_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "${NAGISA_HTTP_PORT:-8000}:8000"
      # gRPC, loopback only by default: nothing outside this host needs it.
      - "127.0.0.1:${NAGISA_GRPC_PORT:-9000}:9000"
    volumes:
      # Named volumes, not bind mounts: Docker copies the image's ownership
      # (uid/gid 65532) onto a fresh named volume, which is what lets this
      # non-root container write without an init script.
      - nagisa-data:/app/data
    user: "${NAGISA_UID:-65532}:${NAGISA_GID:-65532}"
    healthcheck:
      # The runtime image is Alpine, so busybox wget is available. This asks the
      # service itself rather than just opening a socket. Note that
      # /v1/system/health answers 200 even when a dependency is down (the verdict
      # is in the body), so this proves the process serves HTTP, not that object
      # storage is reachable — `docker compose logs nagisa` and a `deep=true`
      # call are what tell those apart.
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1:8000/v1/system/health"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 25s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  nagisa-data:
    name: nagisa-data
  seaweedfs-data:
    name: seaweedfs-data
