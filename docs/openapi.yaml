# Do not edit by hand: run `make api && make docs` instead.
openapi: 3.0.3
info:
  title: Nagisa 网盘 API
  version: 1.0.0
  description: |
    Nagisa 网盘后端 HTTP API。

    ## 认证
    除下文列出的公开接口外，所有接口都需要在请求头携带 `Authorization: Bearer <accessToken>`。
    访问令牌由 `POST /v1/auth/login` 签发；调用前请先用 `GET /v1/auth/config` 取得 RSA 公钥，
    把密码用 RSA-OAEP(SHA-256) 加密后 base64 编码再发送，服务端不会接受明文密码。
    受密码保护的文件夹需要额外的 `X-Node-Token` 请求头，由 `POST /v1/nodes/{node_id}/unlock` 签发。

    公开接口：`AuthService.GetAuthConfig`、`AuthService.Login`、`AuthService.RefreshToken`、`ShareService.AccessShare`、`ShareService.ListShareChildren`、`ShareService.GetShareDownloadUrl`、`SystemService.GetSystemInfo`、`SystemService.HealthCheck`。

    ## 数据传输格式
    请求与响应使用 protobuf 的规范 JSON 映射：
    枚举使用名称（如 `"PERMISSION_UPLOAD"`），64 位整数使用字符串（如 `"size": "1048576"`），
    `bytes` 字段使用 base64，`google.protobuf.Timestamp` 使用 RFC 3339 字符串，
    `google.protobuf.FieldMask` 使用逗号分隔的 camelCase 路径字符串（如 `"description,visibility"`）。
    字段名同时接受 camelCase（文档中的写法）与原始下划线写法，便于调用方平滑迁移。

    ## 错误
    失败响应统一为 `{"code":401,"reason":"NETDISK_UNAUTHENTICATED","message":"..."}`。
    `reason` 取自 `ErrorReason` 枚举，调用方应当按它分支，而不是解析 `message`。

    ## 授权模型
    账号等级（`rank`）构成严格的全序：默认管理员 1000、管理员 500、普通用户 100、访客 10。
    调用方只能管理等级严格低于自己的账号，并且只能授予自己拥有的权限。
    节点访问按「账号权限上限 → 属主通行 → 显式拒绝 → 显式允许（含继承）→ 可见范围 → 文件夹密码」的顺序判定，
    详见 `docs/permissions.md`。

    ## 原始字节绑定
    `GET /v1/files/{node_id}/content`、`GET /v1/files/{node_id}/archive`、`PUT /v1/files/uploads/{upload_id}/parts/{part_number}/raw` 直接收发二进制内容，
    授权由 URL 签名或访问令牌承担，详见各接口说明。
  contact:
    name: Nagisa Netdisk
  license:
    name: MIT
paths:
  /v1/audit/logs/list:
    get:
      tags:
        - AuditService
      description: ListAuditLogs returns a page of audit entries, newest first by default.
      operationId: AuditService_ListAuditLogs
      parameters:
        - name: pageSize
          in: query
          description: |-
            Optional. Maximum number of entries to return. Defaults to 20, capped at
             500.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Optional. The standard list filter.
             Supported fields:
                * `actor_id`
                * `actor_name`
                * `action` (i.e. `action:"node."` for a prefix match)
                * `target_type`
                * `target_id`
                * `success` (i.e. `success` for successful calls, `NOT success` for
                  failed ones; `success=true` and `success=false` are also accepted)
                * `ip`
                * `created_at` range
          schema:
            type: string
        - name: orderBy
          in: query
          description: |-
            Optional. Comma-separated ordering fields, in the AIP syntax where a
             descending field is written with a `desc` suffix (`order_by=created_at desc`).
             Supported fields: `created_at`, `action`, `actor_name`.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.AuditLogSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/audit/logs/{id}:
    get:
      tags:
        - AuditService
      description: GetAuditLog returns a single audit entry by id.
      operationId: AuditService_GetAuditLog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.AuditLog'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/audit/summary:
    get:
      tags:
        - AuditService
      description: GetAuditSummary aggregates the trail by action, actor and day.
      operationId: AuditService_GetAuditSummary
      parameters:
        - name: from
          in: query
          description: Optional. Start of the window. Defaults to 7 days before to.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Optional. End of the window. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: actionPrefix
          in: query
          description: Optional. Restrict the aggregation to one action prefix.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.AuditSummary'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/auth/config:
    get:
      tags:
        - AuthService
      description: |-
        GetAuthConfig returns the parameters the client needs before it can log
         in, including the RSA public key used to encode passwords. This endpoint
         is public.

        本接口为公开接口，无需访问令牌。
      operationId: AuthService_GetAuthConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.AuthConfig'
        "500":
          $ref: '#/components/responses/Internal'
        "403":
          $ref: '#/components/responses/Forbidden'
      security: []
  /v1/auth/guest:
    post:
      tags:
        - AuthService
      description: |-
        GuestLogin opens a read-only session for the built-in guest account
         without a password, so a client can show what guests may read straight
         away. The account's permission set is fixed and cannot be changed by
         anybody, and the reply carries an access token only: there is nothing to
         refresh, a client simply asks again when the token expires.
         Returns UNSUPPORTED when the deployment does not enable guest login.

        本接口为公开接口，无需访问令牌。
      operationId: AuthService_GuestLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.GuestLoginRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.LoginReply'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
      security: []
  /v1/auth/login:
    post:
      tags:
        - AuthService
      description: |-
        Login exchanges an account name and an encoded password for an access
         token and a refresh token.
         Returns UNAUTHENTICATED when the account does not exist or the password
         does not match, and PERMISSION_DENIED when the account is disabled.

        本接口为公开接口，无需访问令牌。
      operationId: AuthService_Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.LoginRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.LoginReply'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
      security: []
  /v1/auth/logout:
    post:
      tags:
        - AuthService
      description: |-
        Logout revokes the supplied refresh token and, when revoke_all is set,
         every refresh token of the account.
      operationId: AuthService_Logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.LogoutRequest'
        required: true
      responses:
        "200":
          description: OK
          content: {}
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/auth/me:
    get:
      tags:
        - AuthService
      description: GetCurrentUser returns the account behind the presented access token.
      operationId: AuthService_GetCurrentUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.User'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/auth/password/change:
    post:
      tags:
        - AuthService
      description: |-
        ChangePassword replaces the caller's own password. The current password
         must be supplied and encoded the same way as on login. Every other refresh
         token of the account is revoked on success.
      operationId: AuthService_ChangePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.ChangePasswordRequest'
        required: true
      responses:
        "200":
          description: OK
          content: {}
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/auth/refresh:
    post:
      tags:
        - AuthService
      description: |-
        RefreshToken rotates a refresh token into a fresh token pair. The
         presented refresh token is revoked on success.
         Returns UNAUTHENTICATED when the token is unknown, revoked or expired.

        本接口为公开接口，无需访问令牌。
      operationId: AuthService_RefreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.RefreshTokenRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.LoginReply'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
      security: []
  /v1/auth/sessions/list:
    get:
      tags:
        - AuthService
      description: ListSessions returns the caller's active refresh sessions.
      operationId: AuthService_ListSessions
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          schema:
            type: string
        - name: includeInactive
          in: query
          description: Include sessions that are expired or revoked.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.SessionSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/auth/sessions/revoke:
    post:
      tags:
        - AuthService
      description: RevokeSession revokes one of the caller's own sessions by id.
      operationId: AuthService_RevokeSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.RevokeSessionRequest'
        required: true
      responses:
        "200":
          description: OK
          content: {}
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
  /v1/files/upload:
    post:
      tags:
        - FileService
      description: |-
        UploadSmallFile stores a payload carried inside the request. Intended for
         files at or below the max_inline_size advertised by SystemService, which
         defaults to 4 MiB.
      operationId: FileService_UploadSmallFile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.UploadSmallFileRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.Node'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/uploads/abort:
    post:
      tags:
        - FileService
      description: AbortUpload cancels a session and reclaims every staged part.
      operationId: FileService_AbortUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.AbortUploadRequest'
        required: true
      responses:
        "200":
          description: OK
          content: {}
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/uploads/complete:
    post:
      tags:
        - FileService
      description: |-
        CompleteUpload verifies every declared part, assembles the object and
         commits the node in one transaction.
         Returns UPLOAD_INCOMPLETE when parts are missing or their sizes do not add
         up, PRECONDITION_FAILED when the checksum does not match, and
         NAME_CONFLICT when the destination name was taken meanwhile.
      operationId: FileService_CompleteUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.CompleteUploadRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.Node'
        "409":
          $ref: '#/components/responses/Conflict'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "400":
          $ref: '#/components/responses/BadRequest'
  /v1/files/uploads/create:
    post:
      tags:
        - FileService
      description: |-
        InitiateUpload opens a multipart upload session. When a session with the
         same parent, name and owner is still pending it is returned instead of a
         new one, which makes retries and resumes idempotent.
      operationId: FileService_InitiateUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.InitiateUploadRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.UploadSession'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/uploads/list:
    get:
      tags:
        - FileService
      description: ListUploads returns the caller's upload sessions.
      operationId: FileService_ListUploads
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Optional. Restrict to one status.
          schema:
            type: integer
            format: enum
        - name: parentId
          in: query
          description: Optional. Restrict to a destination folder.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.UploadSessionSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/uploads/parts/confirm:
    post:
      tags:
        - FileService
      description: |-
        ConfirmUploadPart records the etag produced by a direct-to-storage part
         upload. Only meaningful in UPLOAD_MODE_PRESIGNED.
      operationId: FileService_ConfirmUploadPart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.ConfirmUploadPartRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.UploadPart'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/uploads/{id}:
    get:
      tags:
        - FileService
      description: GetUpload returns one upload session, including the parts already stored.
      operationId: FileService_GetUpload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.UploadSession'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/uploads/{uploadId}/parts:
    get:
      tags:
        - FileService
      description: |-
        ListUploadParts returns the parts of a session, which lets a client resume
         without re-sending completed parts.
      operationId: FileService_ListUploadParts
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
        - name: fromPartNumber
          in: query
          description: |-
            Optional. Only return parts with a number greater than this value, which
             keeps a resume handshake small.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.UploadPartSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/uploads/{uploadId}/parts/{partNumber}:
    put:
      tags:
        - FileService
      description: |-
        UploadChunk streams one part through the server. part_number is one-based
         and must not exceed UploadSession.total_parts. Content type is inferred
         from the parent session.
      operationId: FileService_UploadChunk
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
        - name: partNumber
          in: path
          description: One-based part number.
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.UploadChunkRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.UploadPart'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/{nodeId}/archive-url:
    get:
      tags:
        - FileService
      description: |-
        GetArchiveUrl returns a signed URL that streams a folder, or a file, as a
         zip archive. Large folders are streamed on the fly rather than materialised.
      operationId: FileService_GetArchiveUrl
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
        - name: expiresInSeconds
          in: query
          schema:
            type: integer
            format: int32
        - name: archiveName
          in: query
          description: Name of the produced archive without the extension.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.SignedUrl'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/files/{nodeId}/download-url:
    get:
      tags:
        - FileService
      description: |-
        GetDownloadUrl returns a signed URL for the original bytes of a file
         node. In a presigned deployment the URL points at object storage, so the
         download never traverses this server. The URL encodes the node id, the
         caller, the expiry and the disposition, and is validated again when it is
         redeemed.
      operationId: FileService_GetDownloadUrl
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
        - name: expiresInSeconds
          in: query
          description: Requested lifetime in seconds. Clamped to the configured maximum.
          schema:
            type: integer
            format: int32
        - name: inline
          in: query
          description: Serve inline instead of as an attachment.
          schema:
            type: boolean
        - name: fileName
          in: query
          description: Override the file name offered to the client.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.SignedUrl'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/{nodeId}/preview-url:
    get:
      tags:
        - FileService
      description: |-
        GetPreviewUrl returns a signed URL for an inline preview or a thumbnail.
         Returns UNSUPPORTED when no preview can be produced for the mime type.
      operationId: FileService_GetPreviewUrl
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
        - name: expiresInSeconds
          in: query
          schema:
            type: integer
            format: int32
        - name: thumbnail
          in: query
          description: Return the thumbnail instead of the full preview.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.SignedUrl'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/copy:
    post:
      tags:
        - NodeService
      description: CopyNodes copies nodes, including folder subtrees, into another folder.
      operationId: NodeService_CopyNodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.CopyNodesRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeSet'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
  /v1/nodes/delete:
    post:
      tags:
        - NodeService
      description: |-
        DeleteNodes moves nodes to the trash. The rows and the stored objects are
         retained until PurgeNodes or EmptyTrash.
      operationId: NodeService_DeleteNodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.DeleteNodesRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.DeleteNodesReply'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/folders/create:
    post:
      tags:
        - NodeService
      description: |-
        CreateFolder creates a folder. The folder may carry a description, a
         visibility, a password and, through SetNodeAcl, an allow/deny list.
      operationId: NodeService_CreateFolder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.CreateFolderRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.Node'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/nodes/list:
    get:
      tags:
        - NodeService
      description: |-
        ListNodes returns the children of a folder, or the root listing when
         parent_id is empty. Set recursive to walk the whole subtree.
      operationId: NodeService_ListNodes
      parameters:
        - name: parentId
          in: query
          description: Folder to list. Empty lists the root level.
          schema:
            type: string
        - name: pageSize
          in: query
          description: |-
            Optional. Maximum number of nodes to return. Defaults to 20, capped at
             1000.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Optional. Token from a previous response's next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Optional. The standard list filter.
             Supported fields:
                * `name` (i.e. `name:"report"`)
                * `kind` (i.e. `kind=2`)
                * `mime_type` (i.e. `mime_type:"image/"` prefix match with `:`)
                * `extension`
                * `size` (i.e. `size>1048576`)
                * `owner_id`
                * `status` (i.e. `status=1`)
                * `created_at` and `updated_at` ranges
          schema:
            type: string
        - name: orderBy
          in: query
          description: |-
            Optional. Comma-separated ordering fields, in the AIP syntax where a
             descending field is written with a `desc` suffix (`order_by=size desc,name`).
             Folders are always listed before files.
             Supported fields: `name`, `size`, `kind`, `mime_type`, `extension`,
             `created_at`, `updated_at`.
          schema:
            type: string
        - name: recursive
          in: query
          description: Walk the whole subtree instead of a single level.
          schema:
            type: boolean
        - name: maxDepth
          in: query
          description: Maximum depth to descend when recursive is set. Zero means unlimited.
          schema:
            type: integer
            format: int32
        - name: includeTrashed
          in: query
          description: Include trashed children. Requires PERMISSION_TRASH_MANAGE.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/move:
    post:
      tags:
        - NodeService
      description: |-
        MoveNodes moves nodes to another folder in one transaction. The operation
         is all-or-nothing: a single rejected node rolls the whole batch back.
      operationId: NodeService_MoveNodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.MoveNodesRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/search:
    get:
      tags:
        - NodeService
      description: SearchNodes performs a tree-wide search over names and descriptions.
      operationId: NodeService_SearchNodes
      parameters:
        - name: query
          in: query
          description: |-
            Substring matched against the name, case-insensitively. Empty matches
             everything.
          schema:
            type: string
        - name: scopeNodeId
          in: query
          description: |-
            Optional. Restrict the search to a subtree. Empty searches the whole tree
             visible to the caller.
          schema:
            type: string
        - name: kind
          in: query
          description: Optional. Restrict to a node kind.
          schema:
            type: integer
            format: enum
        - name: mimeType
          in: query
          description: Optional. Restrict to a mime type prefix, for example "image/".
          schema:
            type: string
        - name: ownerId
          in: query
          description: Optional. Restrict to an owner account id.
          schema:
            type: string
        - name: minSize
          in: query
          description: Optional. Minimum size in bytes, inclusive.
          schema:
            type: string
        - name: maxSize
          in: query
          description: Optional. Maximum size in bytes, inclusive. Zero means unlimited.
          schema:
            type: string
        - name: updatedAfter
          in: query
          description: Optional. Only return nodes modified at or after this time.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          description: Optional. Only return nodes modified at or before this time.
          schema:
            type: string
            format: date-time
        - name: matchDescription
          in: query
          description: Match the query against the description instead of the name.
          schema:
            type: boolean
        - name: pageSize
          in: query
          description: |-
            Optional. Maximum number of nodes to return. Defaults to 20, capped at
             1000.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Optional. Token from a previous response's next_page_token.
          schema:
            type: string
        - name: orderBy
          in: query
          description: |-
            Optional. Comma-separated ordering fields, in the AIP syntax where a
             descending field is written with a `desc` suffix (`order_by=updated_at desc`).
             Supported fields: `name`, `size`, `updated_at`, `created_at`, `relevance`.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/trash/empty:
    post:
      tags:
        - NodeService
      description: EmptyTrash purges every trashed node visible to the caller.
      operationId: NodeService_EmptyTrash
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.EmptyTrashRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.PurgeNodesReply'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/trash/list:
    get:
      tags:
        - NodeService
      description: ListTrash returns the trashed nodes visible to the caller.
      operationId: NodeService_ListTrash
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Optional. The standard list filter, same syntax as
             ListNodesRequest.filter plus `trashed_at` ranges.
          schema:
            type: string
        - name: orderBy
          in: query
          description: |-
            Optional. Comma-separated ordering fields. Supported fields: `name`,
             `size`, `trashed_at`, `updated_at`.
          schema:
            type: string
        - name: originalParentId
          in: query
          description: Optional. Restrict the listing to nodes trashed from this folder.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/trash/purge:
    post:
      tags:
        - NodeService
      description: |-
        PurgeNodes permanently deletes nodes and their stored objects. Requires
         PERMISSION_TRASH_MANAGE.
      operationId: NodeService_PurgeNodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.PurgeNodesRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.PurgeNodesReply'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/trash/restore:
    post:
      tags:
        - NodeService
      description: RestoreNodes restores nodes from the trash.
      operationId: NodeService_RestoreNodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.RestoreNodesRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/tree:
    get:
      tags:
        - NodeService
      description: |-
        GetNodeTree returns a folder subtree expanded to the requested depth in a
         single round trip.
      operationId: NodeService_GetNodeTree
      parameters:
        - name: rootId
          in: query
          description: Folder to expand. Empty expands the caller's root level.
          schema:
            type: string
        - name: depth
          in: query
          description: Maximum depth to descend. Defaults to 1.
          schema:
            type: integer
            format: int32
        - name: pageSize
          in: query
          description: Maximum number of children returned per folder. Defaults to 200.
          schema:
            type: integer
            format: int32
        - name: filter
          in: query
          description: |-
            Optional. The standard list filter, applied at every level. Same syntax as
             ListNodesRequest.filter.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeTree'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/update:
    put:
      tags:
        - NodeService
      description: |-
        UpdateNode applies a partial update to a node. Supported paths: `name`,
         `description`, `visibility`, `metadata`, `password`, `remove_password`,
         `parent_id`. Renaming or moving requires PERMISSION_EDIT on the node.
      operationId: NodeService_UpdateNode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.UpdateNodeRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.Node'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/versions/restore:
    post:
      tags:
        - NodeService
      description: RestoreNodeVersion promotes an older version to be the current content.
      operationId: NodeService_RestoreNodeVersion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.RestoreNodeVersionRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.Node'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/{id}:
    get:
      tags:
        - NodeService
      description: GetNode returns a single node by id.
      operationId: NodeService_GetNode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.Node'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/{id}/acl:
    get:
      tags:
        - NodeService
      description: |-
        GetNodeAcl returns the ACL entries attached to a node together with the
         entries inherited from ancestors and the caller's effective permissions.
      operationId: NodeService_GetNodeAcl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeAcl'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/{id}/path:
    get:
      tags:
        - NodeService
      description: GetNodePath returns the breadcrumb from the root to the node.
      operationId: NodeService_GetNodePath
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodePath'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/{id}/stats:
    get:
      tags:
        - NodeService
      description: GetNodeStats returns aggregate counters for the node subtree.
      operationId: NodeService_GetNodeStats
      parameters:
        - name: id
          in: path
          description: Node to summarise. Empty summarises the caller's whole tree.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeStats'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/nodes/{nodeId}/acl:
    post:
      tags:
        - NodeService
      description: |-
        SetNodeAcl replaces the complete ACL of a node. Requires
         PERMISSION_ACL_MANAGE on the node.
      operationId: NodeService_SetNodeAcl
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.SetNodeAclRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeAcl'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/{nodeId}/unlock:
    post:
      tags:
        - NodeService
      description: |-
        UnlockNode exchanges a folder password for a short-lived node token that
         the client sends in the X-Node-Token header to reach the folder and its
         descendants. The password must be RSA-OAEP(SHA-256) encrypted and base64
         encoded, exactly like an account password.
      operationId: NodeService_UnlockNode
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.UnlockNodeRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeUnlock'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/{nodeId}/versions/list:
    get:
      tags:
        - NodeService
      description: ListNodeVersions returns the content history of a file node.
      operationId: NodeService_ListNodeVersions
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeVersionSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/nodes/{nodeId}/versions/{versionId}:
    delete:
      tags:
        - NodeService
      description: DeleteNodeVersion drops one version and reclaims its stored object.
      operationId: NodeService_DeleteNodeVersion
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content: {}
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/shares/access:
    post:
      tags:
        - ShareService
      description: |-
        AccessShare resolves a share token into the shared node and its first
         level of children. This endpoint is public. When the share is password
         protected and no valid access_token is supplied it returns
         NETDISK_NODE_LOCKED together with a password hint.

        本接口为公开接口，无需访问令牌。
      operationId: ShareService_AccessShare
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.AccessShareRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.ShareAccess'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
      security: []
  /v1/shares/by-node/list:
    get:
      tags:
        - ShareService
      description: ListSharesByNode returns the shares attached to one node.
      operationId: ShareService_ListSharesByNode
      parameters:
        - name: nodeId
          in: query
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.ShareSet'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
  /v1/shares/children/list:
    post:
      tags:
        - ShareService
      description: |-
        ListShareChildren browses a shared folder. This endpoint is public and
         requires the access_token returned by AccessShare for protected shares.

        本接口为公开接口，无需访问令牌。
      operationId: ShareService_ListShareChildren
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.ListShareChildrenRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.NodeSet'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
      security: []
  /v1/shares/create:
    post:
      tags:
        - ShareService
      description: |-
        CreateShare grants a capability over a node. Requires PERMISSION_SHARE on
         the node and PERMISSION_DOWNLOAD when the share may download.
      operationId: ShareService_CreateShare
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.CreateShareRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.Share'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
  /v1/shares/download-url:
    post:
      tags:
        - ShareService
      description: |-
        GetShareDownloadUrl returns a signed URL for a node inside a share. This
         endpoint is public and honours the share capability set, its expiry, its
         password and its download budget.

        本接口为公开接口，无需访问令牌。
      operationId: ShareService_GetShareDownloadUrl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.GetShareDownloadUrlRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.SignedUrl'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
      security: []
  /v1/shares/list:
    get:
      tags:
        - ShareService
      description: |-
        ListShares returns share links. Callers without PERMISSION_USER_MANAGE see
         only their own shares.
      operationId: ShareService_ListShares
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Optional. The standard list filter.
             Supported fields: `node_id`, `owner_id`, `name`, `status`, `token`,
             `created_at` and `expires_at` ranges.
          schema:
            type: string
        - name: orderBy
          in: query
          description: |-
            Optional. Comma-separated ordering fields. Supported fields: `name`,
             `created_at`, `updated_at`, `expires_at`, `download_count`, `view_count`.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.ShareSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/shares/update:
    put:
      tags:
        - ShareService
      description: |-
        UpdateShare changes the capability set, password, expiry or budget of an
         existing share.
      operationId: ShareService_UpdateShare
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.UpdateShareRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.Share'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/shares/{id}:
    get:
      tags:
        - ShareService
      description: |-
        GetShare returns one share link by id. The caller must own the share or
         hold PERMISSION_USER_MANAGE.
      operationId: ShareService_GetShare
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.Share'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
    delete:
      tags:
        - ShareService
      description: DeleteShare revokes a share immediately.
      operationId: ShareService_DeleteShare
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content: {}
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/system/health:
    get:
      tags:
        - SystemService
      description: |-
        HealthCheck reports whether the process can reach its dependencies. This
         endpoint is public.

        本接口为公开接口，无需访问令牌。
      operationId: SystemService_HealthCheck
      parameters:
        - name: deep
          in: query
          description: Probe dependencies instead of only reporting process liveness.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.HealthStatus'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
      security: []
  /v1/system/info:
    get:
      tags:
        - SystemService
      description: |-
        GetSystemInfo returns the capabilities, limits and public auth parameters
         of this deployment. This endpoint is public.

        本接口为公开接口，无需访问令牌。
      operationId: SystemService_GetSystemInfo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.SystemInfo'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
      security: []
  /v1/system/maintenance/run:
    post:
      tags:
        - SystemService
      description: |-
        RunMaintenance triggers the housekeeping jobs: expiring stale upload
         sessions, releasing objects queued for deletion, reclaiming orphaned
         objects, expiring share links and recounting per-account usage.
      operationId: SystemService_RunMaintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.RunMaintenanceRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.MaintenanceReport'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/system/settings/list:
    get:
      tags:
        - SystemService
      description: |-
        ListSystemSettings returns the runtime tunables that may be changed
         without a restart.
      operationId: SystemService_ListSystemSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.SystemSettingSet'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/system/settings/update:
    put:
      tags:
        - SystemService
      description: |-
        UpdateSystemSettings writes runtime tunables. Values are validated against
         the documented bounds of each key.
      operationId: SystemService_UpdateSystemSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.UpdateSystemSettingsRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.SystemSettingSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/system/storage/stats:
    get:
      tags:
        - SystemService
      description: GetStorageStats aggregates storage usage across accounts.
      operationId: SystemService_GetStorageStats
      parameters:
        - name: topOwners
          in: query
          description: Number of largest consumers to return. Defaults to 10, capped at 100.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.StorageStats'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/users/create:
    post:
      tags:
        - UserService
      description: |-
        CreateUser provisions an account. The supplied rank must be lower than the
         caller's rank and the supplied permissions must be a subset of the
         caller's permissions. When role is omitted the preset of ROLE_GUEST is
         used, so an unconfigured account is read-only.
         Returns PERMISSION_DENIED when the caller cannot manage the requested
         rank or permission set, and ALREADY_EXISTS on a duplicate username.
      operationId: UserService_CreateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.CreateUserRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.User'
        "500":
          $ref: '#/components/responses/Internal'
        "409":
          $ref: '#/components/responses/Conflict'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
  /v1/users/list:
    get:
      tags:
        - UserService
      description: |-
        ListUsers returns a page of accounts. Requires PERMISSION_USER_MANAGE.

         Declared before GetUser on purpose: the HTTP router registers routes in
         declaration order, so `/v1/users/list` has to be claimed before the
         `/v1/users/{id}` wildcard, otherwise "list" is read as an account id and
         the request fails with INVALID_ARGUMENT.
      operationId: UserService_ListUsers
      parameters:
        - name: pageSize
          in: query
          description: |-
            Optional. Maximum number of accounts to return. Defaults to 20, capped at
             200.
          schema:
            type: integer
            format: int32
        - name: pageToken
          in: query
          description: Optional. Token from a previous response's next_page_token.
          schema:
            type: string
        - name: filter
          in: query
          description: |-
            Optional. The standard list filter.
             Supported fields:
                * `username` (i.e. `username:"alice"`)
                * `nickname`
                * `email`
                * `role` (i.e. `role=2`)
                * `status` (i.e. `status=1`)
                * `rank` (i.e. `rank<500`)
                * `created_at` range
                * `last_login_at` range
          schema:
            type: string
        - name: orderBy
          in: query
          description: |-
            Optional. Comma-separated ordering fields.
             Supported fields: `username`, `nickname`, `role`, `rank`, `status`,
             `used_bytes`, `created_at`, `updated_at`, `last_login_at`.
          schema:
            type: string
        - name: includeDeleted
          in: query
          description: Optional. Include accounts with USER_STATUS_DELETED.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.UserSet'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "400":
          $ref: '#/components/responses/BadRequest'
  /v1/users/password/reset:
    post:
      tags:
        - UserService
      description: |-
        ResetUserPassword sets a new password for another account and revokes
         every session of that account.
      operationId: UserService_ResetUserPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.ResetUserPasswordRequest'
        required: true
      responses:
        "200":
          description: OK
          content: {}
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/users/permissions/catalog:
    get:
      tags:
        - UserService
      description: |-
        ListPermissionCatalog returns every permission with its Chinese label,
         grouped by category. Available to every authenticated caller.
      operationId: UserService_ListPermissionCatalog
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.PermissionCatalog'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
  /v1/users/permissions/set:
    post:
      tags:
        - UserService
      description: |-
        SetUserPermissions replaces an account's permission set. The new set must
         be a subset of the caller's own permissions.
      operationId: UserService_SetUserPermissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.SetUserPermissionsRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.User'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/users/roles/list:
    get:
      tags:
        - UserService
      description: |-
        ListRolePresets returns the built-in permission templates together with
         the rank bounds the caller may assign. This endpoint is available to every
         authenticated caller so account forms can render themselves.
      operationId: UserService_ListRolePresets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.RolePresetSet'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/users/stats/{id}:
    get:
      tags:
        - UserService
      description: |-
        GetUserStats returns storage counters for one account. A caller without
         PERMISSION_USER_MANAGE may only read its own counters.
      operationId: UserService_GetUserStats
      parameters:
        - name: id
          in: path
          description: Account id. The literal value "me" resolves to the calling account.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.UserStats'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
  /v1/users/update:
    put:
      tags:
        - UserService
      description: |-
        UpdateUser applies a partial update. Only fields named in update_mask are
         written. role, rank, permissions and quota_bytes may only be changed by a
         caller that outranks the target and holds the matching permission.
      operationId: UserService_UpdateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/netdisk.v1.UpdateUserRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.User'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/users/{id}:
    get:
      tags:
        - UserService
      description: |-
        GetUser returns one account. A caller without PERMISSION_USER_MANAGE may
         only read its own account.
      operationId: UserService_GetUser
      parameters:
        - name: id
          in: path
          description: Account id. The literal value "me" resolves to the calling account.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.User'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
    delete:
      tags:
        - UserService
      description: |-
        DeleteUser soft deletes an account, revokes its sessions and moves its
         nodes to the trash. Requires PERMISSION_USER_MANAGE and a strictly higher
         rank.
      operationId: UserService_DeleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: trashNodes
          in: query
          description: Move the account's nodes to the trash instead of leaving them in place.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content: {}
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/{node_id}/content:
    get:
      tags:
        - FileService
      summary: 流式下载原文件（原始字节绑定）
      description: |-
        按 `GetDownloadUrl` 返回的签名地址下载原文件。支持 `Range` 请求头，因此可以断点续传；响应会带上 `Content-Disposition`、`ETag` 与 `Accept-Ranges`。

        授权完全由 URL 签名承担：`exp` 为过期时间戳，`sig` 为 HMAC 签名，`sub` 为发起者账号，`extra` 为 `inline` 或 `attachment`。签名绑定方法、路径、节点与过期时间，无法挪用到其它资源。
      operationId: FileService_DownloadContent
      security: []
      parameters:
        - name: node_id
          in: path
          required: true
          description: 文件节点 ID
          schema:
            type: string
        - name: exp
          in: query
          required: true
          description: 签名过期时间（Unix 秒）
          schema:
            type: string
        - name: sig
          in: query
          required: true
          description: 签名值
          schema:
            type: string
        - name: sub
          in: query
          required: false
          description: 签名对应的账号 ID
          schema:
            type: string
        - name: extra
          in: query
          required: false
          description: '`inline` 表示内联展示，`attachment` 表示下载'
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: 字节范围，例如 `bytes=0-1048575`
          schema:
            type: string
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 部分内容，与 `Range` 请求对应
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/Internal'
        "401":
          $ref: '#/components/responses/Unauthenticated'
  /v1/files/{node_id}/archive:
    get:
      tags:
        - FileService
      summary: 打包下载文件夹（原始字节绑定）
      description: |-
        把文件夹整棵子树实时压缩为 zip 流式返回，不会在服务端产生临时对象；对单个文件节点则返回只含该文件的压缩包。

        签名由 `GetArchiveUrl` 签发，规则与内容下载一致，`extra` 为压缩包名称。
      operationId: FileService_DownloadArchive
      security: []
      parameters:
        - name: node_id
          in: path
          required: true
          description: 文件或文件夹节点 ID
          schema:
            type: string
        - name: exp
          in: query
          required: true
          description: 签名过期时间（Unix 秒）
          schema:
            type: string
        - name: sig
          in: query
          required: true
          description: 签名值
          schema:
            type: string
        - name: sub
          in: query
          required: false
          description: 签名对应的账号 ID
          schema:
            type: string
        - name: extra
          in: query
          required: false
          description: 压缩包名称（不含扩展名）
          schema:
            type: string
      responses:
        "200":
          description: zip 压缩包
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "500":
          $ref: '#/components/responses/Internal'
  /v1/files/uploads/{upload_id}/parts/{part_number}/raw:
    put:
      tags:
        - FileService
      summary: 以原始字节上传分片
      description: |-
        与 `FileService.UploadChunk` 等价，但请求体是原始字节而不是 base64 字符串，浏览器可以直接把文件切片 PUT 上来，省去约三分之一的传输开销。

        必须携带访问令牌，且只能是上传会话的拥有者或持有 storage_manage 权限的账号。Content-Length 必须与分片实际长度一致。
      operationId: FileService_UploadChunkRaw
      parameters:
        - name: upload_id
          in: path
          required: true
          description: 上传会话 ID
          schema:
            type: string
        - name: part_number
          in: path
          required: true
          description: 分片序号，从 1 开始
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 分片已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/netdisk.v1.UploadPart'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/Internal'
components:
  schemas:
    netdisk.v1.AbortUploadRequest:
      required:
        - uploadId
      type: object
      properties:
        uploadId:
          type: string
      description: AbortUploadRequest is the input for FileService.AbortUpload.
    netdisk.v1.AccessShareRequest:
      required:
        - token
      type: object
      properties:
        token:
          type: string
          description: Share token.
        password:
          type: string
          description: RSA-OAEP(SHA-256) encrypted, base64 encoded link password.
        accessToken:
          type: string
          description: |-
            Access token from a previous successful access, used to re-enter a
             protected share without resending the password.
        nodeId:
          type: string
          description: |-
            Optional. Folder inside the share to resolve. Empty resolves the shared
             node itself.
        pageSize:
          type: integer
          format: int32
        pageToken:
          type: string
      description: AccessShareRequest is the input for ShareService.AccessShare.
    netdisk.v1.AclEntry:
      type: object
      properties:
        id:
          type: string
          description: Server-assigned identifier. Ignored on input when creating entries.
        nodeId:
          type: string
          description: Node the entry is attached to.
        subjectType:
          type: integer
          description: What the entry applies to.
          format: enum
        subjectId:
          type: string
          description: |-
            Account id for SUBJECT_TYPE_USER, role name for SUBJECT_TYPE_ROLE, empty
             for SUBJECT_TYPE_EVERYONE.
        subjectName:
          type: string
          description: Display name of the subject, resolved by the server.
        effect:
          type: integer
          description: Whether the entry allows or denies.
          format: enum
        permissions:
          type: array
          items:
            type: integer
            format: enum
          description: Permissions covered by this entry.
        permissionsMask:
          type: string
          description: Bitmask form of permissions, useful for compact storage and comparison.
        inherit:
          type: boolean
          description: |-
            Whether the entry is inherited by descendants. Deny entries always apply
             to the whole subtree regardless of this flag.
        createdAt:
          type: string
          description: Time at which the entry was created. Server-assigned, read-only.
          format: date-time
        createdBy:
          type: string
          description: Account that created the entry. Server-assigned, read-only.
      description: AclEntry grants or denies a permission set on a node for one subject.
    netdisk.v1.AuditActionCount:
      type: object
      properties:
        action:
          type: string
        actionDisplay:
          type: string
        count:
          type: string
      description: AuditActionCount is one entry of an aggregated audit summary.
    netdisk.v1.AuditActorCount:
      type: object
      properties:
        actorId:
          type: string
        actorName:
          type: string
        count:
          type: string
      description: AuditActorCount is one actor of an aggregated audit summary.
    netdisk.v1.AuditLog:
      type: object
      properties:
        id:
          type: string
        actorId:
          type: string
          description: Account that performed the action. Empty for anonymous callers.
        actorName:
          type: string
          description: Account name at the time of the action.
        action:
          type: string
          description: Machine readable action name, for example "node.create_folder".
        actionDisplay:
          type: string
          description: Human readable Chinese description.
        targetType:
          type: string
          description: Resource family, for example "node", "user" or "share".
        targetId:
          type: string
          description: Identifier of the affected resource.
        targetName:
          type: string
          description: Display name of the affected resource at the time of the action.
        success:
          type: boolean
          description: Whether the action succeeded.
        errorReason:
          type: string
          description: Error reason when success is false.
        detail:
          type: object
          additionalProperties:
            type: string
          description: Free-form detail, for example the previous and new name.
        ip:
          type: string
          description: Source address.
        userAgent:
          type: string
          description: Client user agent.
        requestId:
          type: string
          description: Correlation id shared with the server logs.
        createdAt:
          type: string
          description: Time the action completed.
          format: date-time
      description: AuditLog is one recorded action.
    netdisk.v1.AuditLogSet:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.AuditLog'
        nextPageToken:
          type: string
        totalSize:
          type: string
      description: AuditLogSet is a paginated collection of audit entries.
    netdisk.v1.AuditSummary:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        total:
          type: string
        failureCount:
          type: string
        byAction:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.AuditActionCount'
        byActor:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.AuditActorCount'
        byDay:
          type: object
          additionalProperties:
            type: string
          description: Counts keyed by ISO-8601 date.
      description: AuditSummary aggregates the audit trail over a time window.
    netdisk.v1.AuthConfig:
      type: object
      properties:
        passwordKeyId:
          type: string
          description: |-
            Identifier of the password key, echoed by clients so a key rotation can be
             detected without a failed login.
        passwordEncoding:
          type: string
          description: |-
            Encoding the client must apply to every password field, currently
             "rsa-oaep-sha256".
        passwordPublicKey:
          type: string
          description: PEM encoded PKCS#8 RSA public key.
        accessTokenTtlSeconds:
          type: integer
          description: Access token lifetime in seconds.
          format: int32
        refreshTokenTtlSeconds:
          type: integer
          description: Refresh token lifetime in seconds.
          format: int32
        plainPasswordAllowed:
          type: boolean
          description: |-
            Whether the deployment accepts an unencoded password. Only ever true in a
             local development configuration.
        serverTime:
          type: string
          description: Server clock at the time of the response.
          format: date-time
        guestLoginEnabled:
          type: boolean
          description: |-
            Whether the deployment hands out a read-only guest session without a
             password through AuthService.GuestLogin.
      description: AuthConfig is the public pre-login parameter set.
    netdisk.v1.ChangePasswordRequest:
      required:
        - currentPassword
        - newPassword
      type: object
      properties:
        currentPassword:
          type: string
          description: RSA-OAEP(SHA-256) encrypted, base64 encoded current password.
        newPassword:
          type: string
          description: RSA-OAEP(SHA-256) encrypted, base64 encoded new password.
      description: ChangePasswordRequest is the input for AuthService.ChangePassword.
    netdisk.v1.CompleteUploadRequest:
      required:
        - uploadId
      type: object
      properties:
        uploadId:
          type: string
        etag:
          type: string
          description: Optional. SHA-256 digest of the assembled content.
        comment:
          type: string
          description: Optional. Note attached to the created version.
      description: CompleteUploadRequest is the input for FileService.CompleteUpload.
    netdisk.v1.ConfirmUploadPartRequest:
      required:
        - uploadId
        - partNumber
        - etag
      type: object
      properties:
        uploadId:
          type: string
        partNumber:
          type: integer
          format: int32
        etag:
          type: string
          description: Digest returned by the storage backend for the uploaded part.
        size:
          type: string
          description: Size of the part in bytes.
      description: ConfirmUploadPartRequest is the input for FileService.ConfirmUploadPart.
    netdisk.v1.CopyNodesRequest:
      required:
        - ids
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          description: Nodes to copy.
        targetParentId:
          type: string
          description: Destination folder. Empty copies the nodes to the caller's root level.
        conflictPolicy:
          type: integer
          format: enum
        newNames:
          type: array
          items:
            type: string
          description: |-
            Optional. Rename a node during the copy. Must have the same length as ids
             when set.
      description: CopyNodesRequest is the input for NodeService.CopyNodes.
    netdisk.v1.CreateFolderRequest:
      required:
        - folder
      type: object
      properties:
        folder:
          allOf:
            - $ref: '#/components/schemas/netdisk.v1.Node'
          description: |-
            Folder to create. Only name, parent_id, description, visibility,
             password, password_hint and metadata are read.
        conflictPolicy:
          type: integer
          description: Behaviour when a sibling with the same name exists. Defaults to FAIL.
          format: enum
        password:
          type: string
          description: |-
            RSA-OAEP(SHA-256) encrypted, base64 encoded folder password. Set to
             protect the folder.
        acl:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.AclEntry'
          description: |-
            ACL applied to the new folder in the same transaction. A failing entry
             aborts the creation.
      description: CreateFolderRequest is the input for NodeService.CreateFolder.
    netdisk.v1.CreateShareRequest:
      required:
        - nodeId
      type: object
      properties:
        nodeId:
          type: string
          description: Node to share.
        name:
          type: string
          description: Optional label.
        description:
          type: string
          description: Optional note.
        permissions:
          type: array
          items:
            type: integer
            format: enum
          description: |-
            Capabilities to convey. Only PERMISSION_VIEW, PERMISSION_DOWNLOAD and
             PERMISSION_UPLOAD are meaningful here. Defaults to VIEW and DOWNLOAD.
        permissionsMask:
          type: string
          description: Bitmask alternative to permissions.
        password:
          type: string
          description: |-
            RSA-OAEP(SHA-256) encrypted, base64 encoded link password. Empty means the
             link needs no password.
        passwordHint:
          type: string
          description: Hint shown next to the password prompt.
        expiresAt:
          type: string
          description: Time at which the link stops working. Zero means it never expires.
          format: date-time
        maxDownloads:
          type: string
          description: Maximum number of downloads. Zero means unlimited.
        token:
          type: string
          description: Requested token. The server generates one when empty.
      description: CreateShareRequest is the input for ShareService.CreateShare.
    netdisk.v1.CreateUserRequest:
      required:
        - user
        - password
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/netdisk.v1.User'
          description: Account to create. id, used_bytes, created_at and updated_at are ignored.
        password:
          type: string
          description: RSA-OAEP(SHA-256) encrypted, base64 encoded initial password.
        mustChangePassword:
          type: boolean
          description: Force a password change at first login.
      description: CreateUserRequest is the input for UserService.CreateUser.
    netdisk.v1.DeleteNodesReply:
      type: object
      properties:
        deletedIds:
          type: array
          items:
            type: string
          description: Nodes that were moved to the trash or purged.
        affectedCount:
          type: string
          description: Number of nodes affected, including descendants.
        reclaimedBytes:
          type: string
          description: Bytes reclaimed. Only non-zero for permanent deletes.
      description: DeleteNodesReply reports the outcome of a delete batch.
    netdisk.v1.DeleteNodesRequest:
      required:
        - ids
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          description: Nodes to delete.
        permanent:
          type: boolean
          description: |-
            Skip the trash and delete permanently. Requires
             PERMISSION_TRASH_MANAGE.
      description: DeleteNodesRequest is the input for NodeService.DeleteNodes.
    netdisk.v1.EmptyTrashRequest:
      type: object
      properties:
        trashedBefore:
          type: string
          description: Optional. Only empty the trash entries older than this time.
          format: date-time
      description: EmptyTrashRequest is the input for NodeService.EmptyTrash.
    netdisk.v1.GetShareDownloadUrlRequest:
      required:
        - token
      type: object
      properties:
        token:
          type: string
        nodeId:
          type: string
          description: |-
            File inside the share. Empty downloads the shared node when it is a file,
             or an archive when it is a folder.
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int32
        inline:
          type: boolean
      description: |-
        GetShareDownloadUrlRequest is the input for
         ShareService.GetShareDownloadUrl.
    netdisk.v1.GuestLoginRequest:
      type: object
      properties:
        ip:
          type: string
          description: Client address hint used when the request does not come through a proxy.
        userAgent:
          type: string
          description: Client user agent hint.
      description: GuestLoginRequest is the input for AuthService.GuestLogin.
    netdisk.v1.HealthStatus:
      type: object
      properties:
        status:
          type: string
          description: 'Overall status: "ok", "degraded" or "down".'
        checks:
          type: object
          additionalProperties:
            type: string
          description: 'Per dependency status, for example {"database": "ok"}.'
        uptimeSeconds:
          type: string
        serverTime:
          type: string
          format: date-time
      description: HealthStatus reports dependency reachability.
    netdisk.v1.InitiateUploadRequest:
      required:
        - name
        - size
      type: object
      properties:
        parentId:
          type: string
          description: Destination folder. Empty targets the caller's root level.
        name:
          type: string
          description: Destination file name.
        size:
          type: string
          description: |-
            Total size in bytes. Required, and used to plan the parts and to check the
             quota before a single byte is transferred.
        mimeType:
          type: string
          description: Content type. Inferred from the extension when empty.
        chunkSize:
          type: string
          description: |-
            Requested part size in bytes. Clamped to the configured bounds and
             rounded up to a multiple of 256 KiB.
        mode:
          type: integer
          description: Requested transport. Defaults to the deployment default.
          format: enum
        conflictPolicy:
          type: integer
          description: Behaviour when the destination name is taken. Defaults to RENAME.
          format: enum
        etag:
          type: string
          description: |-
            Optional. Expected SHA-256 digest of the whole file, verified at
             completion.
        description:
          type: string
          description: Optional. Description stored on the resulting node.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional. Key/value pairs stored on the resulting node.
        resumableUploadId:
          type: string
          description: Resume an existing session with this id instead of creating a new one.
      description: InitiateUploadRequest is the input for FileService.InitiateUpload.
    netdisk.v1.ListShareChildrenRequest:
      required:
        - token
      type: object
      properties:
        token:
          type: string
        nodeId:
          type: string
          description: Folder inside the share to list. Empty lists the shared node's children.
        accessToken:
          type: string
          description: Access token returned by AccessShare for protected shares.
        pageSize:
          type: integer
          format: int32
        pageToken:
          type: string
        orderBy:
          type: string
          description: |-
            Optional. Comma-separated ordering fields, same syntax as
             ListNodesRequest.order_by.
      description: ListShareChildrenRequest is the input for ShareService.ListShareChildren.
    netdisk.v1.LoginReply:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          format: int32
        refreshExpiresIn:
          type: integer
          description: Refresh token lifetime in seconds.
          format: int32
        user:
          $ref: '#/components/schemas/netdisk.v1.User'
      description: LoginReply carries the token pair and the authenticated account.
    netdisk.v1.LoginRequest:
      required:
        - username
        - password
      type: object
      properties:
        username:
          type: string
          description: Account name.
        password:
          type: string
          description: RSA-OAEP(SHA-256) encrypted, base64 encoded password.
        ip:
          type: string
          description: Client address hint used when the request does not come through a proxy.
        userAgent:
          type: string
          description: Client user agent hint.
        rememberMe:
          type: boolean
          description: Whether the refresh token should be long lived.
      description: LoginRequest is the input for AuthService.Login.
    netdisk.v1.LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token to revoke. Optional when the caller is authenticated.
        revokeAll:
          type: boolean
          description: Revoke every refresh token of the account instead of a single one.
      description: LogoutRequest is the input for AuthService.Logout.
    netdisk.v1.MaintenanceReport:
      type: object
      properties:
        dryRun:
          type: boolean
        tasks:
          type: array
          items:
            type: string
          description: Tasks that were requested.
        expiredUploads:
          type: string
          description: Upload sessions moved to UPLOAD_STATUS_EXPIRED.
        deletedObjects:
          type: string
          description: Objects released from the pending deletion queue.
        orphanObjects:
          type: string
          description: Objects reclaimed because nothing referenced them.
        expiredShares:
          type: string
          description: Share links moved to SHARE_STATUS_EXPIRED.
        recountedUsers:
          type: string
          description: Accounts whose used_bytes was recomputed.
        purgedNodes:
          type: string
          description: Nodes permanently purged after their retention window.
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal problems encountered.
        durationMs:
          type: string
          description: Wall clock duration in milliseconds.
        finishedAt:
          type: string
          format: date-time
      description: MaintenanceReport describes what a maintenance run did.
    netdisk.v1.MoveNodesRequest:
      required:
        - ids
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          description: Nodes to move.
        targetParentId:
          type: string
          description: Destination folder. Empty moves the nodes to the caller's root level.
        conflictPolicy:
          type: integer
          description: |-
            Behaviour when the destination already holds a node with the same name.
             Defaults to FAIL.
          format: enum
        newNames:
          type: array
          items:
            type: string
          description: |-
            Optional. Rename a node during the move. Must have the same length as ids
             when set.
      description: MoveNodesRequest is the input for NodeService.MoveNodes.
    netdisk.v1.Node:
      type: object
      properties:
        id:
          type: string
          description: Application-generated UUIDv7 identifier. Read-only.
        parentId:
          type: string
          description: Identifier of the containing folder. Empty for a root level node.
        name:
          type: string
          description: Entry name, unique among the live children of the parent folder.
        kind:
          type: integer
          description: Folder or file.
          format: enum
        ownerId:
          type: string
          description: Account that owns the node.
        ownerName:
          type: string
          description: Display name of the owner.
        size:
          type: string
          description: Size in bytes. Always zero for folders.
        mimeType:
          type: string
          description: Detected content type. Empty for folders.
        extension:
          type: string
          description: Lower-case file extension without the dot. Empty for folders.
        etag:
          type: string
          description: Object digest recorded at upload completion.
        status:
          type: integer
          description: Lifecycle state.
          format: enum
        description:
          type: string
          description: Free-form description. Folders store their purpose here.
        visibility:
          type: integer
          description: Coarse access policy evaluated before the ACL.
          format: enum
        passwordProtected:
          type: boolean
          description: Whether a folder password is set.
        passwordHint:
          type: string
          description: Optional hint shown to callers that have not unlocked the node.
        locked:
          type: boolean
          description: Whether the caller still has to unlock the node.
        hasThumbnail:
          type: boolean
          description: Whether a preview thumbnail has been generated.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Application defined key/value pairs.
        path:
          type: string
          description: Materialised ancestor path made of node ids, for example "/a/b/".
        displayPath:
          type: string
          description: Human readable absolute path, for example "/文档/2024/报告.pdf".
        depth:
          type: integer
          description: Depth below the root. Zero for a root level node.
          format: int32
        childCount:
          type: string
          description: Number of direct children. Folders only.
        fileCount:
          type: string
          description: Number of files in the subtree, including this node when it is a file.
        folderCount:
          type: string
          description: Number of folders in the subtree.
        subtreeSize:
          type: string
          description: Total bytes in the subtree.
        effectivePermissions:
          type: array
          items:
            type: integer
            format: enum
          description: Permissions the calling account holds on this node.
        effectivePermissionsMask:
          type: string
          description: Bitmask form of effective_permissions.
        owned:
          type: boolean
          description: Whether the caller owns the node.
        shared:
          type: boolean
          description: Whether at least one active share link points at the node.
        shareCount:
          type: integer
          description: Number of active share links.
          format: int32
        versionCount:
          type: integer
          description: Number of retained content versions.
          format: int32
        currentVersionId:
          type: string
          description: Identifier of the current content version. Empty for folders.
        createdAt:
          type: string
          description: Time at which the node was created. Read-only.
          format: date-time
        updatedAt:
          type: string
          description: Time at which the node was last modified. Read-only.
          format: date-time
        createdBy:
          type: string
          description: Account that created the node. Read-only.
        updatedBy:
          type: string
          description: Account that last modified the node. Read-only.
        trashedAt:
          type: string
          description: Time at which the node was moved to the trash. Read-only.
          format: date-time
        originalParentId:
          type: string
          description: Folder the node was trashed from, used by RestoreNodes. Read-only.
      description: Node is the canonical representation of a file or folder.
    netdisk.v1.NodeAcl:
      type: object
      properties:
        nodeId:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.AclEntry'
          description: Entries stored directly on the node.
        inheritedEntries:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.AclEntry'
          description: Entries inherited from ancestors.
        effectivePermissions:
          type: array
          items:
            type: integer
            format: enum
          description: Effective permissions of the calling account on the node.
        effectivePermissionsMask:
          type: string
          description: Bitmask form of effective_permissions.
        owned:
          type: boolean
          description: Whether the calling account owns the node.
        editable:
          type: boolean
          description: Whether the calling account may change the ACL.
      description: NodeAcl is the access control list of a node.
    netdisk.v1.NodePath:
      type: object
      properties:
        ancestors:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.Node'
          description: Ancestors ordered from the root down to, but excluding, the node.
        node:
          allOf:
            - $ref: '#/components/schemas/netdisk.v1.Node'
          description: The node itself.
        displayPath:
          type: string
          description: Human readable absolute path.
      description: NodePath is the breadcrumb of a node.
    netdisk.v1.NodeSet:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.Node'
        nextPageToken:
          type: string
        totalSize:
          type: string
          description: Total number of nodes matching the filter, ignoring pagination.
        totalBytes:
          type: string
          description: Aggregate size of the returned page.
      description: NodeSet is a paginated collection of nodes.
    netdisk.v1.NodeStats:
      type: object
      properties:
        nodeId:
          type: string
        fileCount:
          type: string
        folderCount:
          type: string
        totalSize:
          type: string
        trashedCount:
          type: string
        trashedSize:
          type: string
        largestFileSize:
          type: string
          description: Size of the largest file in the subtree.
        largestFileName:
          type: string
          description: Name of the largest file in the subtree.
        sizeByCategory:
          type: object
          additionalProperties:
            type: string
          description: 'Bytes per mime type family, for example {"image": 1024}.'
      description: NodeStats summarises a subtree.
    netdisk.v1.NodeTree:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/netdisk.v1.Node'
        children:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.NodeTree'
      description: NodeTree is a folder with its expanded descendants.
    netdisk.v1.NodeUnlock:
      type: object
      properties:
        nodeId:
          type: string
        unlockToken:
          type: string
          description: Signed token to send in the X-Node-Token header.
        expiresIn:
          type: integer
          description: Lifetime of the token in seconds.
          format: int32
        expiresAt:
          type: string
          format: date-time
      description: NodeUnlock is the reply of a successful UnlockNode call.
    netdisk.v1.NodeVersion:
      type: object
      properties:
        id:
          type: string
        nodeId:
          type: string
        version:
          type: integer
          description: Monotonically increasing revision number within the node.
          format: int32
        size:
          type: string
        mimeType:
          type: string
        etag:
          type: string
        comment:
          type: string
          description: Optional note describing why the revision was kept.
        current:
          type: boolean
          description: Whether this revision is the current content.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
      description: NodeVersion is one retained content revision of a file node.
    netdisk.v1.NodeVersionSet:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.NodeVersion'
        nextPageToken:
          type: string
      description: NodeVersionSet is a collection of node versions.
    netdisk.v1.OwnerUsage:
      type: object
      properties:
        ownerId:
          type: string
        ownerName:
          type: string
        usedBytes:
          type: string
        fileCount:
          type: string
        folderCount:
          type: string
        quotaBytes:
          type: string
      description: OwnerUsage is one row of the per-account usage breakdown.
    netdisk.v1.PermissionCatalog:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.PermissionInfo'
        granted:
          type: array
          items:
            type: integer
            format: enum
          description: Permission set the calling account currently holds.
        grantedMask:
          type: string
          description: Bitmask form of granted.
      description: PermissionCatalog is the collection of permissions for client rendering.
    netdisk.v1.PermissionInfo:
      type: object
      properties:
        permission:
          type: integer
          format: enum
        name:
          type: string
          description: Stable machine name, for example "upload".
        displayName:
          type: string
          description: Human readable Chinese label.
        description:
          type: string
          description: Human readable Chinese explanation.
        category:
          type: string
          description: Grouping used by settings screens, for example "content" or "system".
      description: PermissionInfo describes one permission for client-side rendering.
    netdisk.v1.PurgeNodesReply:
      type: object
      properties:
        purgedIds:
          type: array
          items:
            type: string
        affectedCount:
          type: string
        reclaimedBytes:
          type: string
      description: PurgeNodesReply reports the outcome of a purge batch.
    netdisk.v1.PurgeNodesRequest:
      required:
        - ids
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          description: Trashed nodes to delete permanently.
      description: PurgeNodesRequest is the input for NodeService.PurgeNodes.
    netdisk.v1.RefreshTokenRequest:
      required:
        - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
      description: RefreshTokenRequest is the input for AuthService.RefreshToken.
    netdisk.v1.ResetUserPasswordRequest:
      required:
        - id
        - password
      type: object
      properties:
        id:
          type: string
        password:
          type: string
          description: RSA-OAEP(SHA-256) encrypted, base64 encoded new password.
        mustChangePassword:
          type: boolean
          description: Force a password change at next login.
      description: ResetUserPasswordRequest is the input for UserService.ResetUserPassword.
    netdisk.v1.RestoreNodeVersionRequest:
      required:
        - nodeId
        - versionId
      type: object
      properties:
        nodeId:
          type: string
        versionId:
          type: string
      description: RestoreNodeVersionRequest is the input for NodeService.RestoreNodeVersion.
    netdisk.v1.RestoreNodesRequest:
      required:
        - ids
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          description: Trashed nodes to restore.
        targetParentId:
          type: string
          description: Destination folder override. Empty restores to original_parent_id.
        conflictPolicy:
          type: integer
          format: enum
      description: RestoreNodesRequest is the input for NodeService.RestoreNodes.
    netdisk.v1.RevokeSessionRequest:
      required:
        - id
      type: object
      properties:
        id:
          type: string
      description: RevokeSessionRequest is the input for AuthService.RevokeSession.
    netdisk.v1.RolePreset:
      type: object
      properties:
        role:
          type: integer
          format: enum
        name:
          type: string
          description: Stable machine name, for example "guest".
        displayName:
          type: string
          description: Human readable Chinese label.
        description:
          type: string
        defaultRank:
          type: integer
          description: Rank assigned when the creator does not override it.
          format: int32
        permissions:
          type: array
          items:
            type: integer
            format: enum
          description: Permissions granted by the template.
        permissionsMask:
          type: string
          description: Bitmask form of permissions.
      description: RolePreset is a permission template offered when creating an account.
    netdisk.v1.RolePresetSet:
      type: object
      properties:
        presets:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.RolePreset'
        maxGrantableRank:
          type: integer
          description: Exclusive upper bound the caller may assign to rank.
          format: int32
        callerRank:
          type: integer
          description: Rank of the calling account.
          format: int32
      description: RolePresetSet is the collection of built-in permission templates.
    netdisk.v1.RunMaintenanceRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          description: Report what would happen without changing anything.
        tasks:
          type: array
          items:
            type: string
          description: |-
            Tasks to run. Empty runs every task.
             Supported values: "expire_uploads", "purge_deletions", "gc_orphans",
             "expire_shares", "recount_usage", "purge_trash".
        trashRetentionDays:
          type: integer
          description: Only purge trash entries older than this many days. Defaults to 30.
          format: int32
      description: RunMaintenanceRequest is the input for SystemService.RunMaintenance.
    netdisk.v1.Session:
      type: object
      properties:
        id:
          type: string
        ip:
          type: string
          description: Client address that created the session.
        userAgent:
          type: string
          description: User agent recorded at creation time.
        createdAt:
          type: string
          description: Time at which the session was created.
          format: date-time
        lastUsedAt:
          type: string
          description: Time at which the session was last refreshed.
          format: date-time
        expiresAt:
          type: string
          description: Time at which the session expires.
          format: date-time
        active:
          type: boolean
          description: Whether the session is still usable.
        current:
          type: boolean
          description: Whether this is the session behind the current request.
      description: Session is one refresh token family shown to its owner.
    netdisk.v1.SessionSet:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.Session'
        nextPageToken:
          type: string
      description: SessionSet is a page of sessions.
    netdisk.v1.SetNodeAclRequest:
      required:
        - nodeId
      type: object
      properties:
        nodeId:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.AclEntry'
          description: Complete replacement set of entries. An empty list clears the ACL.
        recursive:
          type: boolean
          description: Apply the same entries to every descendant that does not override them.
      description: SetNodeAclRequest is the input for NodeService.SetNodeAcl.
    netdisk.v1.SetUserPermissionsRequest:
      required:
        - id
      type: object
      properties:
        id:
          type: string
        permissions:
          type: array
          items:
            type: integer
            format: enum
          description: Complete replacement permission set.
        permissionsMask:
          type: string
          description: |-
            Bitmask alternative to permissions. Used when permissions is empty and the
             mask is non-zero.
      description: SetUserPermissionsRequest is the input for UserService.SetUserPermissions.
    netdisk.v1.Share:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
          description: URL safe token that identifies the share. Read-only after creation.
        nodeId:
          type: string
          description: Node the share points at.
        node:
          allOf:
            - $ref: '#/components/schemas/netdisk.v1.Node'
          description: Snapshot of the shared node.
        ownerId:
          type: string
          description: Account that created the share.
        ownerName:
          type: string
          description: Display name of the owner.
        name:
          type: string
          description: Optional label shown to visitors.
        description:
          type: string
          description: Optional note shown to visitors.
        permissions:
          type: array
          items:
            type: integer
            format: enum
          description: Capabilities conveyed by the link.
        permissionsMask:
          type: string
          description: Bitmask form of permissions.
        passwordProtected:
          type: boolean
          description: Whether a password must be supplied through AccessShare.
        passwordHint:
          type: string
          description: Hint shown next to the password prompt.
        expiresAt:
          type: string
          description: Time at which the link stops working. Zero means it never expires.
          format: date-time
        maxDownloads:
          type: string
          description: Maximum number of downloads. Zero means unlimited.
        downloadCount:
          type: string
          description: Downloads served so far.
        viewCount:
          type: string
          description: Successful accesses so far.
        status:
          type: integer
          format: enum
        url:
          type: string
          description: Fully qualified share URL, built from the configured public base URL.
        editable:
          type: boolean
          description: Whether the calling account may modify or revoke the share.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
      description: Share is one share link.
    netdisk.v1.ShareAccess:
      type: object
      properties:
        share:
          $ref: '#/components/schemas/netdisk.v1.Share'
        node:
          allOf:
            - $ref: '#/components/schemas/netdisk.v1.Node'
          description: The shared node.
        children:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.Node'
          description: First level of children when the shared node is a folder.
        nextPageToken:
          type: string
        accessToken:
          type: string
          description: |-
            Token to present as access_token on subsequent public calls. Empty for
             shares without a password.
        expiresIn:
          type: integer
          description: Lifetime of access_token in seconds.
          format: int32
        expiresAt:
          type: string
          format: date-time
      description: |-
        ShareAccess is the public view of a share after the token, and the password
         when required, have been accepted.
    netdisk.v1.ShareSet:
      type: object
      properties:
        shares:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.Share'
        nextPageToken:
          type: string
        totalSize:
          type: string
      description: ShareSet is a paginated collection of shares.
    netdisk.v1.SignedUrl:
      type: object
      properties:
        url:
          type: string
          description: Fully qualified URL to redeem.
        method:
          type: string
          description: HTTP method the URL must be redeemed with.
        expiresAt:
          type: string
          description: Expiry of the URL.
          format: date-time
        expiresIn:
          type: integer
          description: Lifetime in seconds.
          format: int32
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the client must send with the request.
        nodeId:
          type: string
          description: Node the URL points at.
        size:
          type: string
          description: |-
            Size of the payload in bytes. Zero for archives whose size is unknown in
             advance.
        fileName:
          type: string
          description: Suggested file name for a download.
        mimeType:
          type: string
          description: Content type the payload will be served with.
      description: SignedUrl is a time limited URL that carries its own authorisation.
    netdisk.v1.StorageStats:
      type: object
      properties:
        totalBytes:
          type: string
        totalFiles:
          type: string
        totalFolders:
          type: string
        totalUsers:
          type: string
        activeUsers:
          type: string
        disabledUsers:
          type: string
        trashedBytes:
          type: string
        trashedNodes:
          type: string
        uploadsInProgress:
          type: string
        activeShares:
          type: string
        versionsBytes:
          type: string
        sizeByCategory:
          type: object
          additionalProperties:
            type: string
          description: 'Bytes by mime type family, for example {"image": 1048576}.'
        topOwners:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.OwnerUsage'
          description: Largest consumers, ordered by used_bytes descending.
        backendUsedBytes:
          type: string
          description: |-
            Bytes of objects the backend reported as used, including versions and
             pending deletions.
      description: StorageStats aggregates storage usage.
    netdisk.v1.SystemInfo:
      type: object
      properties:
        name:
          type: string
          description: Service name.
        version:
          type: string
          description: Build version.
        apiVersion:
          type: string
          description: API version, currently "v1".
        features:
          type: array
          items:
            type: string
          description: |-
            Feature flags, for example "chunked_upload", "share_links",
             "node_password", "acl", "versions", "public_share".
        maxUploadSize:
          type: string
          description: Maximum accepted size of a single file in bytes. Zero means unlimited.
        defaultChunkSize:
          type: string
          description: Part size used when a client does not request one.
        minChunkSize:
          type: string
          description: |-
            Smallest accepted part size. Object storage requires at least 5 MiB for
             every part but the last.
        maxInlineSize:
          type: string
          description: Largest payload accepted by UploadSmallFile.
        uploadSessionTtlSeconds:
          type: integer
          description: Lifetime of an upload session in seconds.
          format: int32
        signedUrlTtlSeconds:
          type: integer
          description: Default lifetime of a signed URL in seconds.
          format: int32
        signedUrlMaxTtlSeconds:
          type: integer
          description: Maximum lifetime of a signed URL in seconds.
          format: int32
        uploadModes:
          type: array
          items:
            type: integer
            format: enum
          description: Transports this deployment offers for part payloads.
        storageBackend:
          type: string
          description: Object storage backend in use, for example "s3".
        databaseBackend:
          type: string
          description: Database backend in use, for example "sqlite".
        defaultVisibility:
          type: integer
          description: Default visibility applied to newly created nodes.
          format: enum
        registrationEnabled:
          type: boolean
          description: |-
            Whether accounts may be created through the API. In this deployment only
             administrators may create accounts.
        auth:
          allOf:
            - $ref: '#/components/schemas/netdisk.v1.AuthConfig'
          description: Public authentication parameters, including the password key.
        serverTime:
          type: string
          description: Server clock at the time of the response.
          format: date-time
        publicBaseUrl:
          type: string
          description: Base URL used to build share links.
      description: SystemInfo advertises deployment capabilities and limits.
    netdisk.v1.SystemSetting:
      type: object
      properties:
        key:
          type: string
          description: Stable key, for example "guest.default_permissions".
        value:
          type: string
          description: Current value, serialised as a string.
        type:
          type: string
          description: 'Value type: "string", "int", "bool" or "json".'
        description:
          type: string
          description: Human readable Chinese description.
        writable:
          type: boolean
          description: Whether the key may be written through UpdateSystemSettings.
      description: SystemSetting is one runtime tunable.
    netdisk.v1.SystemSettingSet:
      type: object
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.SystemSetting'
      description: SystemSettingSet is a collection of runtime tunables.
    netdisk.v1.UnlockNodeRequest:
      required:
        - nodeId
        - password
      type: object
      properties:
        nodeId:
          type: string
        password:
          type: string
          description: RSA-OAEP(SHA-256) encrypted, base64 encoded folder password.
      description: UnlockNodeRequest is the input for NodeService.UnlockNode.
    netdisk.v1.UpdateNodeRequest:
      required:
        - node
        - updateMask
      type: object
      properties:
        node:
          allOf:
            - $ref: '#/components/schemas/netdisk.v1.Node'
          description: Node carrying the new values. node.id identifies the target.
        updateMask:
          type: string
          description: |-
            Field paths to overwrite. Supported paths: `name`, `description`,
             `visibility`, `metadata`, `parent_id`.
          format: field-mask
        password:
          type: string
          description: |-
            RSA-OAEP(SHA-256) encrypted, base64 encoded new password. Setting it
             requires the `password` path in update_mask.
        removePassword:
          type: boolean
          description: |-
            Remove the folder password. Takes effect when `password` is listed in
             update_mask.
        conflictPolicy:
          type: integer
          description: Behaviour when renaming onto an existing sibling name. Defaults to FAIL.
          format: enum
      description: UpdateNodeRequest is the input for NodeService.UpdateNode.
    netdisk.v1.UpdateShareRequest:
      required:
        - share
        - updateMask
      type: object
      properties:
        share:
          allOf:
            - $ref: '#/components/schemas/netdisk.v1.Share'
          description: Share carrying the new values. share.id identifies the target.
        updateMask:
          type: string
          description: |-
            Field paths to overwrite. Supported paths: `name`, `description`,
             `permissions_mask`, `password`, `password_hint`, `expires_at`,
             `max_downloads`, `status`.
          format: field-mask
        password:
          type: string
          description: |-
            RSA-OAEP(SHA-256) encrypted, base64 encoded new password. Applied when
             `password` is listed in update_mask.
        removePassword:
          type: boolean
          description: |-
            Clear the password. Applied when `password` is listed in update_mask and
             this flag is set.
      description: UpdateShareRequest is the input for ShareService.UpdateShare.
    netdisk.v1.UpdateSystemSettingsRequest:
      type: object
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.SystemSetting'
          description: Settings to write. Only writable keys are accepted.
      description: |-
        UpdateSystemSettingsRequest is the input for
         SystemService.UpdateSystemSettings.
    netdisk.v1.UpdateUserRequest:
      required:
        - user
        - updateMask
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/netdisk.v1.User'
          description: Account carrying the new values. user.id identifies the target.
        updateMask:
          type: string
          description: |-
            Field paths to overwrite. Supported paths: `nickname`, `email`,
             `avatar_url`, `remark`, `role`, `rank`, `permissions_mask`, `status`,
             `quota_bytes`.
          format: field-mask
      description: UpdateUserRequest is the input for UserService.UpdateUser.
    netdisk.v1.UploadChunkRequest:
      required:
        - uploadId
        - partNumber
      type: object
      properties:
        uploadId:
          type: string
        partNumber:
          type: integer
          description: One-based part number.
          format: int32
        content:
          type: string
          description: |-
            Part payload. Over JSON this field is a base64 string; the raw streaming
             binding sends the same bytes as an application/octet-stream body.
          format: bytes
        etag:
          type: string
          description: Optional. Digest the client computed for the part.
      description: UploadChunkRequest is the input for FileService.UploadChunk.
    netdisk.v1.UploadPart:
      type: object
      properties:
        partNumber:
          type: integer
          description: One-based part number.
          format: int32
        size:
          type: string
        etag:
          type: string
          description: Digest reported by the storage backend, used to assemble the object.
        uploadUrl:
          type: string
          description: |-
            Presigned URL to PUT this part directly to object storage. Only populated
             for UPLOAD_MODE_PRESIGNED.
        urlExpiresAt:
          type: string
          description: Expiry of upload_url.
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the client must send with upload_url.
        createdAt:
          type: string
          format: date-time
      description: UploadPart is one stored part of a multipart upload.
    netdisk.v1.UploadPartSet:
      type: object
      properties:
        uploadId:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.UploadPart'
      description: UploadPartSet is a collection of stored parts.
    netdisk.v1.UploadSession:
      type: object
      properties:
        id:
          type: string
        parentId:
          type: string
          description: Destination folder.
        name:
          type: string
          description: Destination file name.
        kind:
          type: integer
          description: Always NODE_KIND_FILE for an upload session.
          format: enum
        size:
          type: string
          description: Declared total size in bytes.
        mimeType:
          type: string
        chunkSize:
          type: string
          description: Size of every part except the last, in bytes.
        totalParts:
          type: integer
          description: Number of parts the declared size implies.
          format: int32
        uploadedParts:
          type: array
          items:
            type: integer
            format: int32
          description: One-based numbers of the parts already stored.
        receivedBytes:
          type: string
          description: Bytes received so far.
        status:
          type: integer
          format: enum
        mode:
          type: integer
          description: Transport selected for part payloads.
          format: enum
        conflictPolicy:
          type: integer
          description: Behaviour applied when the destination name is taken.
          format: enum
        parts:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.UploadPart'
          description: |-
            Parts already stored, with their presigned URLs when mode is
             UPLOAD_MODE_PRESIGNED.
        nodeId:
          type: string
          description: Node created on success. Empty until CompleteUpload returns.
        createdAt:
          type: string
          description: Time at which the session was created. Read-only.
          format: date-time
        updatedAt:
          type: string
          description: Time at which the session was last updated. Read-only.
          format: date-time
        expiresAt:
          type: string
          description: Time at which the session stops accepting parts. Read-only.
          format: date-time
        lastError:
          type: string
          description: Last error recorded by the server, for diagnostics.
      description: UploadSession is one multipart upload.
    netdisk.v1.UploadSessionSet:
      type: object
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.UploadSession'
        nextPageToken:
          type: string
        totalSize:
          type: string
      description: UploadSessionSet is a paginated collection of upload sessions.
    netdisk.v1.UploadSmallFileRequest:
      required:
        - name
        - content
      type: object
      properties:
        parentId:
          type: string
        name:
          type: string
        content:
          type: string
          description: Payload. Over JSON this field is a base64 string.
          format: bytes
        mimeType:
          type: string
        conflictPolicy:
          type: integer
          format: enum
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
      description: UploadSmallFileRequest is the input for FileService.UploadSmallFile.
    netdisk.v1.User:
      type: object
      properties:
        id:
          type: string
          description: Application-generated UUIDv7 identifier. Read-only.
        username:
          type: string
          description: Login name. Unique among accounts. Immutable after creation.
        nickname:
          type: string
          description: Display name.
        email:
          type: string
          description: Contact address. Optional.
        avatarUrl:
          type: string
          description: Avatar URL. Optional.
        role:
          type: integer
          description: Coarse account category.
          format: enum
        rank:
          type: integer
          description: |-
            Authority level. A caller may only manage accounts with a strictly lower
             rank. ROLE_ADMIN is pinned at 1000.
          format: int32
        permissions:
          type: array
          items:
            type: integer
            format: enum
          description: Granted permissions.
        permissionsMask:
          type: string
          description: Bitmask form of permissions.
        status:
          type: integer
          description: Account lifecycle state.
          format: enum
        quotaBytes:
          type: string
          description: Storage quota in bytes. Zero means unlimited.
        usedBytes:
          type: string
          description: Storage currently consumed in bytes.
        fileCount:
          type: string
          description: Number of live files owned by the account.
        folderCount:
          type: string
          description: Number of live folders owned by the account.
        remark:
          type: string
          description: Free-form administrator note.
        mustChangePassword:
          type: boolean
          description: Whether the account must change its password at the next login.
        lastLoginAt:
          type: string
          description: Time of the last successful login. Read-only.
          format: date-time
        createdBy:
          type: string
          description: Account that created this one. Read-only.
        createdAt:
          type: string
          description: Time at which the account was created. Read-only.
          format: date-time
        updatedAt:
          type: string
          description: Time at which the account was last modified. Read-only.
          format: date-time
        manageable:
          type: boolean
          description: Whether the calling account may manage this account. Computed per caller.
        permissionsEditable:
          type: boolean
          description: Whether the calling account may change this account's permission set.
        maxGrantableRank:
          type: integer
          description: Inclusive upper bound the caller may assign to rank for a new account.
          format: int32
      description: User is the canonical representation of an account.
    netdisk.v1.UserSet:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/netdisk.v1.User'
        nextPageToken:
          type: string
        totalSize:
          type: string
          description: Total number of accounts matching the filter, ignoring pagination.
      description: UserSet is a paginated collection of accounts.
    netdisk.v1.UserStats:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        quotaBytes:
          type: string
        usedBytes:
          type: string
        fileCount:
          type: string
        folderCount:
          type: string
        trashedBytes:
          type: string
        trashedCount:
          type: string
        usageRatio:
          type: number
          description: Quota usage ratio in the range [0, 1]. Zero when the quota is unlimited.
          format: double
      description: UserStats summarises one account's storage usage.
    netdisk.v1.Error:
      type: object
      description: 统一错误响应。reason 取自 ErrorReason 枚举，调用方应按其分支。
      required:
        - code
        - reason
      properties:
        code:
          type: integer
          format: int32
          description: HTTP 状态码
        reason:
          type: string
          description: 机器可读的错误原因
          enum:
            - NETDISK_NOT_FOUND
            - NETDISK_INVALID_ARGUMENT
            - NETDISK_UNAUTHENTICATED
            - NETDISK_PERMISSION_DENIED
            - NETDISK_CONFLICT
            - NETDISK_INTERNAL
            - NETDISK_UNAVAILABLE
            - NETDISK_QUOTA_EXCEEDED
            - NETDISK_STORAGE_ERROR
            - NETDISK_NODE_LOCKED
            - NETDISK_NAME_CONFLICT
            - NETDISK_CYCLE_DETECTED
            - NETDISK_UPLOAD_INCOMPLETE
            - NETDISK_UPLOAD_EXPIRED
            - NETDISK_TOO_LARGE
            - NETDISK_UNSUPPORTED
            - NETDISK_RESOURCE_EXHAUSTED
            - NETDISK_PRECONDITION_FAILED
            - NETDISK_ALREADY_EXISTS
            - NETDISK_ABORTED
            - NETDISK_ACCOUNT_DISABLED
        message:
          type: string
          description: 人类可读的说明
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 附加上下文
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        访问令牌。先调用 AuthService.Login 取得 accessToken，再以 `Authorization: Bearer <token>` 发送。
    nodeToken:
      type: apiKey
      in: header
      name: X-Node-Token
      description: |-
        文件夹解锁令牌，由 NodeService.UnlockNode 返回。访问受密码保护的文件夹及其子节点时必须携带。
    shareToken:
      type: apiKey
      in: header
      name: X-Share-Token
      description: |-
        分享访问令牌，由 ShareService.AccessShare 返回，用于访问设有密码的分享链接。
    requestId:
      type: apiKey
      in: header
      name: X-Request-Id
      description: |-
        可选。调用方自带的链路标识，会写入审计日志并原样回显。
  responses:
    BadRequest:
      description: 请求不合法或违反字段约束
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netdisk.v1.Error'
    Unauthenticated:
      description: 缺少访问令牌，或令牌无效、已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netdisk.v1.Error'
    Forbidden:
      description: 已认证但缺少所需权限，或账号被禁用，或文件夹未解锁
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netdisk.v1.Error'
    NotFound:
      description: 资源不存在或对调用方不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netdisk.v1.Error'
    Conflict:
      description: 与当前状态冲突，例如同名节点已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netdisk.v1.Error'
    TooLarge:
      description: 请求体或声明的大小超过配置上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netdisk.v1.Error'
    ResourceExhausted:
      description: 触发限流或配额已用尽
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netdisk.v1.Error'
    Internal:
      description: 服务端错误，详见审计日志与响应中的 reason
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netdisk.v1.Error'
    Unavailable:
      description: 依赖不可用，例如对象存储或数据库
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/netdisk.v1.Error'
tags:
  - name: AuthService
    description: 账号认证与会话管理：登录、刷新、退出、修改密码。除 GetAuthConfig 与 Login 外均需访问令牌。
  - name: UserService
    description: 账号管理：仅持有 user_manage 权限且等级严格高于目标的账号可以创建、修改、禁用、删除账号并分配权限。
  - name: NodeService
    description: 文件树：文件夹与文件统一为节点，共用描述、可见范围、访问名单与密码模型。
  - name: FileService
    description: 内容传输：分片上传、签名下载地址、预览与打包下载。
  - name: ShareService
    description: 分享链接：把节点以独立的能力集合发布给没有账号的访问者。AccessShare、ListShareChildren、GetShareDownloadUrl 为匿名接口。
  - name: AuditService
    description: 审计日志：记录每一次状态变更及其结果，只增不改。
  - name: SystemService
    description: 系统信息、存储统计、运行参数与维护任务。GetSystemInfo 与 HealthCheck 为匿名接口。
servers:
  - url: http://127.0.0.1:8000
    description: 本地开发环境
security:
  - bearerAuth: []
